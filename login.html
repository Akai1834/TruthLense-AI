<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1110" />
    <meta name="description" content="Log in to TruthLense AI." />
    <title>Log in — TruthLense AI</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1110;
        --panel: #121a18;
        --line: rgba(230, 241, 235, 0.1);
        --text: #f3f6f2;
        --muted: #9ba9a1;
        --mint: #b7f36b;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 78% 20%, rgba(93, 135, 90, 0.15), transparent 29rem),
          var(--bg);
        color: var(--text);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input {
        font: inherit;
      }

      .login-card {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid rgba(230, 241, 235, 0.13);
        border-radius: 16px;
        background: rgba(18, 26, 24, 0.95);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
        animation: rise-in 450ms ease both;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-size: 16px;
        font-weight: 720;
        letter-spacing: -0.04em;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid rgba(183, 243, 107, 0.36);
        border-radius: 12px;
        background: rgba(183, 243, 107, 0.09);
        color: var(--mint);
      }

      .brand-mark svg {
        width: 20px;
        height: 20px;
      }

      .brand-ai {
        color: var(--mint);
      }

      .eyebrow {
        margin: 28px 0 0;
        color: var(--mint);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      h1 {
        margin: 9px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 37px;
        font-weight: 400;
        letter-spacing: -0.05em;
      }

      .intro {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }

      .demo-warning {
        margin: 0 0 17px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 191, 105, 0.22);
        border-radius: 8px;
        background: rgba(255, 191, 105, 0.06);
        color: #e9c894;
        font-size: 11px;
        line-height: 1.55;
      }

      label {
        display: block;
        margin-top: 14px;
      }

      label span {
        display: block;
        margin-bottom: 7px;
        color: #d9e1db;
        font-size: 12px;
        font-weight: 600;
      }

      input {
        width: 100%;
        height: 45px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: #0d1311;
        color: var(--text);
        font-size: 13px;
      }

      input:focus {
        border-color: rgba(183, 243, 107, 0.65);
        box-shadow: 0 0 0 3px rgba(183, 243, 107, 0.09);
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
        transition:
          transform 180ms ease,
          background 180ms ease,
          border-color 180ms ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .primary {
        width: 100%;
        margin-top: 19px;
        background: var(--mint);
        color: #15200f;
      }

      .primary:hover {
        background: #c7ff80;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 19px 0;
        color: #7f8b83;
        font-size: 10px;
      }

      .divider::before,
      .divider::after {
        height: 1px;
        flex: 1;
        background: var(--line);
        content: "";
      }

      .social-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .social {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.025);
        color: var(--text);
      }

      .social:hover {
        border-color: rgba(183, 243, 107, 0.35);
        background: rgba(183, 243, 107, 0.06);
      }

      .message {
        min-height: 17px;
        margin: 11px 0 0;
        color: #f1a99d;
        font-size: 11px;
        line-height: 1.5;
      }

      .back-home {
        display: block;
        margin-top: 20px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .back-home:hover {
        color: var(--mint);
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 460px) {
        body {
          padding: 16px;
        }

        .login-card {
          padding: 26px 20px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <script src="frontend/config.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="frontend/js/login.js" defer></script>
  </head>
  <body>
    <main class="login-card">
      <a class="brand" href="index.html" aria-label="TruthLense AI home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M2.8 12s3.2-6.2 9.2-6.2 9.2 6.2 9.2 6.2-3.2 6.2-9.2 6.2S2.8 12 2.8 12Z" stroke="currentColor" stroke-width="1.6" />
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </span>
        <span>TruthLense<span class="brand-ai">AI</span></span>
      </a>

      <p class="eyebrow">Your clearer view starts here</p>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to privately test an image or video with the TruthLense model.</p>
      <p class="demo-warning">
        Use your TruthLense account. Passwords are handled securely by Supabase Auth and are never stored by this app.
      </p>

      <form id="loginForm">
        <div id="createAccountFields" hidden>
          <label>
            <span>Full name</span>
            <input id="nameInput" name="name" type="text" autocomplete="name" placeholder="Your full name" />
          </label>
        </div>

        <label>
          <span>Email address</span>
          <input id="emailInput" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label>
          <span>Password</span>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="Your password" required />
        </label>

        <div id="confirmPasswordWrap" hidden>
          <label>
            <span>Confirm password</span>
            <input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" />
          </label>
        </div>

        <button class="button primary" id="submitButton" type="submit">Log in with email</button>
      </form>
      <button class="button social" id="createAccountButton" type="button" style="width: 100%; margin-top: 10px;">Create an account</button>

      <p class="message" id="formMessage" role="status" aria-live="polite"></p>
      <div class="divider">OR CONTINUE WITH</div>
      <div class="social-buttons">
        <button class="button social" type="button" data-provider="Google">Google</button>
        <button class="button social" type="button" data-provider="Instagram">Instagram</button>
        <button class="button social" type="button" data-provider="Facebook">Facebook</button>
        <button class="button social" type="button" data-provider="X">X</button>
      </div>
      <a class="back-home" href="index.html">← Back to home</a>
    </main>

  </body>
</html>
